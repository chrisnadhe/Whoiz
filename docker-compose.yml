services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: whoiz:latest
    container_name: whoiz_app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

