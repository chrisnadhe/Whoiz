<!-- Password Generator Result Fragment -->
{% if results %}
<div class="space-y-6 animate-fade-in">
    <!-- Password Box -->
    <div class="relative p-5 bg-slate-50 dark:bg-slate-900/60 border border-slate-100 dark:border-slate-850 rounded-2xl flex items-center justify-between group shadow-inner">
        <span id="generated-password" class="text-lg font-bold font-mono tracking-wide text-slate-800 dark:text-white break-all pr-10 select-all">{{ results.password }}</span>
        <button onclick="copyToClipboard(this, 'generated-password')" class="absolute right-4 top-1/2 -translate-y-1/2 p-2 bg-white dark:bg-[#1e293b] hover:bg-slate-50 dark:hover:bg-slate-800 border border-slate-150 dark:border-slate-800 rounded-xl text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 shadow-sm transition-all flex items-center space-x-1.5 cursor-pointer" title="Salin Kata Sandi">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
            </svg>
        </button>
    </div>

    <!-- Strength Metrics -->
    <div class="space-y-2">
        <div class="flex justify-between items-center text-xs font-bold uppercase tracking-wider">
            <span class="text-slate-400 dark:text-slate-500">Tingkat Keamanan:</span>
            <span class="{% if results.strength == 'Weak' %}text-red-500{% elif results.strength == 'Medium' %}text-amber-500{% elif results.strength == 'Strong' %}text-green-500{% else %}text-emerald-500{% endif %}">
                {{ results.strength_id }} ({{ results.entropy }} Bits)
            </span>
        </div>
        
        <!-- Color Bar -->
        <div class="w-full h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden flex">
            {% if results.strength == 'Weak' %}
            <div class="h-full bg-red-500 w-1/4"></div>
            {% elif results.strength == 'Medium' %}
            <div class="h-full bg-amber-500 w-2/4"></div>
            {% elif results.strength == 'Strong' %}
            <div class="h-full bg-green-500 w-3/4"></div>
            {% else %}
            <div class="h-full bg-emerald-500 w-full"></div>
            {% endif %}
        </div>
    </div>
</div>
{% endif %}
